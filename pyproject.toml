[project]
name = "prismlab"
version = "1.0.0"
description = "AI model performance testing and analysis"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
cli = ["requests>=2.32,<3"]
backend = [
  { include-group = "cli" },
  "authlib==1.9.1",
  "fastapi>=0.116,<1",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.11,<3",
  "Pillow>=12.0,<13",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "deepeval==4.3.2",
  # OpenAI 3 introduces httpx2 and silently changes Authlib's existing transport.
  "openai>=2,<3",
  "ragas==0.4.3",
  # RAGAS's official testset transforms use rapidfuzz for document relationships.
  "rapidfuzz>=3,<4",
  "langchain==0.3.27",
  "langchain-community==0.3.31",
  "langchain-openai==0.3.35",
  # Keep LangChain transport compatible with the existing Authlib/httpx stack.
  "langsmith==0.4.59",
  "jsonschema>=4.20,<5",
  "numpy>=2,<3",
]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
default-groups = ["backend", "dev"]
required-version = "==0.12.22"
